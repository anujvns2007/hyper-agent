# Default: GPU remote stack (run on the GPU host).
# For MacBook MCP services, use docker-compose.local.yaml instead.
#
#   GPU host:  docker compose up -d --build
#   MacBook:   docker compose -f docker-compose.local.yaml up -d
#
# Equivalent explicit form:
#   docker compose -f docker-compose.remote.yaml up -d --build

include:
  - docker-compose.remote.yaml
