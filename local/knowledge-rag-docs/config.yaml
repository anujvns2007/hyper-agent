# Native Mac — public docs index (streamable HTTP on 127.0.0.1:8179/mcp).
# Run from local/knowledge-rag-docs/ via scripts/run-knowledge-rag-docs.sh
paths:
  documents_dir: "documents"
  data_dir: "data"
  models_cache_dir: "data/models_cache"

server:
  transport: "streamable-http"
  host: "127.0.0.1"
  port: 8179

models:
  embedding:
    model: "BAAI/bge-large-en-v1.5"   # 1024D — native ARM ONNX (matches remote-gpu quality)
    dimensions: 1024
    gpu: false
  reranker:
    enabled: true
    model: "Xenova/ms-marco-MiniLM-L-6-v2"
    top_k_multiplier: 3

documents:
  supported_formats:
    - ".md"
    - ".txt"
    - ".rst"
    - ".adoc"
    - ".pdf"
    - ".py"
    - ".json"
    - ".yaml"
    - ".yml"
    - ".toml"
  exclude_patterns:
    - "**/.git/**"
    - "**/node_modules/**"
    - "**/__pycache__/**"
  chunking:
    chunk_size: 1500
    chunk_overlap: 150

search:
  hybrid:
    enabled: true
  rerank:
    enabled: true

category_mappings:
  python: ["python"]
  typescript: ["typescript", "ts"]
  javascript: ["javascript", "js", "node"]
  docker: ["docker"]
  fastapi: ["fastapi"]
  react: ["react"]
  nextjs: ["nextjs", "next"]
  postgres: ["postgres", "postgresql"]
  redis: ["redis"]
  git: ["git", "github", "gitlab", "commit", "branch", "merge", "rebase", "clone", "pull request"]
  bitbucket: ["bitbucket", "atlassian", "bb", "pipeline", "repository", "workspace", "pullrequest"]
  flutter: ["flutter", "dart", "widget", "mobile"]
  dart: ["dart", "flutter"]
  go: ["go", "golang", "goroutine", "channel", "module", "gomod", "interface"]
  rust: ["rust", "cargo"]
  cpp: ["cpp", "c++", "cplusplus"]
  webrtc: ["webrtc", "rtc", "peerconnection", "ice", "stun", "turn"]
  security-protocols: ["security", "tls", "ssl", "dtls", "srtp", "oauth", "jwt", "rfc", "ietf", "ipsec", "ssh"]
  pqc: ["pqc", "post-quantum", "quantum", "kyber", "dilithium", "oqs", "nist"]
  jira: ["jira", "atlassian", "forge", "jql", "issue", "sprint", "epic", "story", "board"]
  gstreamer: ["gstreamer", "gst", "pipeline", "pad", "element", "gstreamer", "playbin", "caps", "buffer"]
  ffmpeg: ["ffmpeg", "ffprobe", "avcodec", "libav", "transcode", "mux", "demux"]
