# Docker — public docs index (streamable HTTP on 0.0.0.0:8179 → host :8179/mcp).
# Mount config.yaml, documents/, and data/ from the host (see local/docker-compose.yaml).
paths:
  documents_dir: "documents"
  data_dir: "data"
  models_cache_dir: "data/models_cache"

server:
  transport: "streamable-http"
  host: "0.0.0.0"
  port: 8179

models:
  embedding:
    model: "BAAI/bge-large-en-v1.5"   # 1024D — CPU ONNX (matches remote-gpu quality)
    dimensions: 1024
    gpu: false
  reranker:
    enabled: true
    model: "Xenova/ms-marco-MiniLM-L-6-v2"
    top_k_multiplier: 3

documents:
  supported_formats:
    - ".md"
    - ".txt"
    - ".rst"
    - ".pdf"
    - ".py"
    - ".json"
    - ".yaml"
    - ".yml"
    - ".toml"
  exclude_patterns:
    - "**/.git/**"
    - "**/node_modules/**"
    - "**/__pycache__/**"
  chunking:
    chunk_size: 1500
    chunk_overlap: 150

search:
  hybrid:
    enabled: true
  rerank:
    enabled: true

# Folder path → category name (documents/<folder>/…)
