# Local MacBook — indexes PROJECT_ROOT (streamable HTTP on :8180/mcp).
paths:
  documents_dir: "/app/documents"
  data_dir: "/app/data"
  models_cache_dir: "/app/data/models_cache"

server:
  transport: "streamable-http"
  host: "0.0.0.0"
  port: 8180

# Embedding + reranker (ONNX, downloaded to models_cache_dir on first run).
# Changing embedding.model requires: stop container, rm chroma_db + index_metadata.json, restart.
models:
  embedding:
    model: "BAAI/bge-small-en-v1.5"   # 384D — CPU default; use bge-large on GPU if desired
    dimensions: 384
    gpu: false                          # flipped to true at runtime when KNOWLEDGE_RAG_GPU=1
    # GPU / quality alternatives (reindex after change):
    # model: "BAAI/bge-base-en-v1.5"   # 768D
    # model: "BAAI/bge-large-en-v1.5"  # 1024D
  reranker:
    enabled: true
    model: "Xenova/ms-marco-MiniLM-L-6-v2"
    top_k_multiplier: 3               # fetch 3× max_results before reranking

documents:
  # Only formats with built-in parsers in knowledge-rag 4.x (see Supported Formats in docs).
  # .rs, .dart, .yaml, .toml, .sh, .go, etc. are NOT parsed — use serena/code-graph for those.
  supported_formats:
    - ".md"
    - ".txt"
    - ".rst"
    - ".py"
    - ".js"
    - ".jsx"
    - ".ts"
    - ".tsx"
    - ".c"
    - ".h"
    - ".cpp"
    - ".cc"
    - ".cxx"
    - ".json"
    - ".xml"
  exclude_patterns:
    - "**/.git/**"
    - "**/node_modules/**"
    - "**/__pycache__/**"
    - "**/.venv/**"
    - "**/venv/**"
    - "**/target/**"
    - "**/build/**"
    - "**/dist/**"
    - "**/vendor/**"
    - "**/.idea/**"
    - "**/.cursor/**"
    - "**/.dart_tool/**"
    - "**/Pods/**"
    - "**/macos/Pods/**"
    - "**/ios/Pods/**"
    - "**/faiss_data_store/**"
    - "**/chroma_db/**"
    - "**/models_cache/**"
    - "**/*.min.js"
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/Cargo.lock"
    - "**/frb_generated*.dart"
    - "**/*-umbrella.h"
  chunking:
    chunk_size: 1200
    chunk_overlap: 200

search:
  hybrid:
    enabled: true
  rerank:
    enabled: true

category_mappings:
  source: ["code", "repo", "project", "local"]
