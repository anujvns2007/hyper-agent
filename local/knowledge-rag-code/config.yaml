# Local MacBook — indexes your PROJECT_ROOT source tree (SSE on :8180).
paths:
  documents_dir: "/app/documents"
  data_dir: "/app/data"
  models_cache_dir: "/app/data/models_cache"

server:
  transport: "streamable-http"
  host: "0.0.0.0"
  port: 8180

documents:
  # Only formats with built-in parsers in knowledge-rag 4.x (see Supported Formats in docs).
  # .rs, .dart, .yaml, .toml, .sh, .go, etc. are NOT parsed — use serena/code-graph for those.
  supported_formats:
    - ".md"
    - ".txt"
    - ".rst"
    - ".py"
    - ".js"
    - ".jsx"
    - ".ts"
    - ".tsx"
    - ".c"
    - ".h"
    - ".cpp"
    - ".cc"
    - ".cxx"
    - ".json"
    - ".xml"
  exclude_patterns:
    - "**/.git/**"
    - "**/node_modules/**"
    - "**/__pycache__/**"
    - "**/.venv/**"
    - "**/venv/**"
    - "**/target/**"
    - "**/build/**"
    - "**/dist/**"
    - "**/vendor/**"
    - "**/.idea/**"
    - "**/.cursor/**"
    - "**/.dart_tool/**"
    - "**/Pods/**"
    - "**/macos/Pods/**"
    - "**/ios/Pods/**"
    - "**/faiss_data_store/**"
    - "**/chroma_db/**"
    - "**/models_cache/**"
    - "**/*.min.js"
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/Cargo.lock"
    - "**/frb_generated*.dart"
    - "**/*-umbrella.h"
  chunking:
    chunk_size: 1200
    chunk_overlap: 200

search:
  hybrid:
    enabled: true
  rerank:
    enabled: true

category_mappings:
  source: ["code", "repo", "project", "local"]
