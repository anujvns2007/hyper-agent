# MacBook — Headroom proxy, MCP servers that need your filesystem.
#
#   cp .env.example .env
#   docker compose up -d --build
#
# Endpoints:
#   headroom:             http://127.0.0.1:8787
#   headroom MCP:         http://127.0.0.1:8790/mcp
#   knowledge-rag-docs:   http://127.0.0.1:8179/mcp  (Docker — CPU ONNX)
#   code-graph:           http://127.0.0.1:5070/mcp
#
# Headroom forwards to vLLM on the GPU host via VLLM_UPSTREAM_URL (default:
# host.docker.internal:8000 — start SSH tunnel -L 8000:127.0.0.1:8000 first).
# knowledge-rag-docs mounts host documents/, data/, and config (see KNOWLEDGE_RAG_* in .env).
#
# Serena runs natively via uvx (Claude Code, Codex) — not in Docker.
# See local/README.md for Serena (native uvx) and Codex setup.

services:
  headroom-proxy:
    build: ./headroom
    image: headroom-local:latest
    container_name: headroom-ai
    working_dir: /workspace
    command:
      - "--port"
      - "8787"
      - "--anthropic-api-url"
      - "${VLLM_UPSTREAM_URL:-http://host.docker.internal:8000}"
      - "--openai-api-url"
      - "${VLLM_UPSTREAM_URL:-http://host.docker.internal:8000}/v1"
      - "--code-aware"
      - "--code-graph"
      - "--memory"
      - "--learn"
      - "--memory-project-root"
      - "/workspace"
      - "--no-ccr-inject-tool"
    environment:
      - HEADROOM_HOST=0.0.0.0
      - HEADROOM_PORT=8787
      - HEADROOM_MCP_PORT=8790
      - HEADROOM_TELEMETRY=off
      - HEADROOM_CODE_AWARE_ENABLED=1
      - HEADROOM_MEMORY_DB_PATH=/data/headroom/memory.db
      - HEADROOM_MEMORY_PROJECT_ROOT=/workspace
      - HOME=/tmp/headroom-home
      - HF_HOME=/opt/headroom-hf-cache
      - HF_HUB_DISABLE_XET=1
      - HF_HUB_OFFLINE=1
      - ANTHROPIC_TARGET_API_URL=${VLLM_UPSTREAM_URL:-http://host.docker.internal:8000}
      - OPENAI_TARGET_API_URL=${VLLM_UPSTREAM_URL:-http://host.docker.internal:8000}/v1
    volumes:
      - ${PROJECT_ROOT:?Set PROJECT_ROOT in .env}:/workspace:ro
      - ./headroom/data:/data/headroom
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/opt/headroom-hf-cache:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8790:8790"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8787/livez || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - local

  code-graph-mcp:
    build: ./code-graph-mcp
    image: code-graph-mcp:latest
    container_name: code-graph-mcp
    volumes:
      - ${PROJECT_ROOT:?Set PROJECT_ROOT in .env}:/workspace:ro
      - ./code-graph-mcp/data:/root/.cache/codebase-memory-mcp
    ports:
      - "5070:5070"
      - "5071:5071"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('net').createConnection(5070,'127.0.0.1',()=>process.exit(0)).on('error',()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 15s
      retries: 25
      start_period: 120s
    restart: unless-stopped
    networks:
      - local

  knowledge-rag-docs:
    build: ./knowledge-rag-docs
    image: knowledge-rag-docs-local:latest
    container_name: knowledge-rag-docs
    environment:
      - KNOWLEDGE_RAG_DIR=/app
    volumes:
      - ${KNOWLEDGE_RAG_CONFIG:-./knowledge-rag-docs/config.yaml}:/app/config.yaml:ro
      - ${KNOWLEDGE_RAG_DOCUMENTS:-./knowledge-rag-docs/documents}:/app/documents
      - ${KNOWLEDGE_RAG_DATA:-./knowledge-rag-docs/data}:/app/data
    ports:
      - "127.0.0.1:8179:8179"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8179),2); s.close()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    networks:
      - local

networks:
  local:
    name: ai-agent-local
