# GPU host — vLLM inference, Headroom compression, public-docs RAG.
#
#   cp .env.example .env   # optional: DOCS_SYNC_INTERVAL_SECONDS
#   docker compose up -d --build
#
# MacBook tunnel (from your laptop):
#   ssh -N -L 8787:127.0.0.1:8787 -L 8179:127.0.0.1:8179 user@gpu-host
#
# Tunneled endpoints on Mac:
#   headroom:             http://127.0.0.1:8787
#   knowledge-rag-docs:   http://127.0.0.1:8179/mcp

services:
  vllm-backend:
    build: ./vllm
    image: vllm-qwen-main:latest
    container_name: vllm-qwen3.6
    entrypoint: vllm
    command: >
      serve Qwen/Qwen3.6-35B-A3B-FP8
      --served-model-name qwen3.6
      --port 8000
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.7
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
    environment:
      - PYTHONWARNINGS=ignore::DeprecationWarning
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      # GB10/Blackwell: nightly DeepGemm MoE path crashes during FP8 weight load
      - VLLM_USE_DEEP_GEMM=0
    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/root/.cache/huggingface:ro
    ipc: host
    shm_size: '12gb'
    mem_limit: 100g
    cpus: 8.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 25s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - remote

  headroom-proxy:
    build: ./headroom
    image: headroom-vllm:latest
    container_name: headroom-ai
    command:
      - "--port"
      - "8787"
      - "--anthropic-api-url"
      - "http://vllm-backend:8000"
      - "--openai-api-url"
      - "http://vllm-backend:8000/v1"
      - "--code-aware"
      - "--no-ccr-inject-tool"
    environment:
      - HEADROOM_HOST=0.0.0.0
      - HEADROOM_TELEMETRY=off
      - HEADROOM_CODE_AWARE_ENABLED=1
      - HOME=/tmp/headroom-home
      - ANTHROPIC_TARGET_API_URL=http://vllm-backend:8000
      - OPENAI_TARGET_API_URL=http://vllm-backend:8000/v1
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8787/livez || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      vllm-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - remote

  docs-sync:
    image: alpine:3.20
    container_name: knowledge-rag-docs-sync
    volumes:
      - ./knowledge-rag-docs/fetch-docs.sh:/fetch-docs.sh:ro
      - ./knowledge-rag-docs/fetch-docs-manifest.tsv:/fetch-docs-manifest.tsv:ro
      - ./knowledge-rag-docs/documents:/documents
    environment:
      - DOCS_ROOT=/documents
      - MANIFEST=/fetch-docs-manifest.tsv
      - DOCS_SYNC_INTERVAL_SECONDS=${DOCS_SYNC_INTERVAL_SECONDS:-86400}
    command: >
      sh -c "apk add --no-cache curl &&
             /fetch-docs.sh &&
             while true; do
               sleep \"$${DOCS_SYNC_INTERVAL_SECONDS}\";
               /fetch-docs.sh;
             done"
    restart: unless-stopped
    networks:
      - remote

  knowledge-rag-docs:
    build: ./knowledge-rag-docs
    image: knowledge-rag-docs:latest
    container_name: knowledge-rag-docs
    volumes:
      - ./knowledge-rag-docs/config.yaml:/app/config.yaml:ro
      - ./knowledge-rag-docs/documents:/app/documents
      - ./knowledge-rag-docs/data:/app/data
    ports:
      - "8179:8179"
    depends_on:
      docs-sync:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8179),2); s.close()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    networks:
      - remote

networks:
  remote:
    name: ai-agent-remote
